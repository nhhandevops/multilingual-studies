# Deploy the PWA to GitHub Pages (project site: /multilingual-studies/).
#
# The content/media packs are NOT in git (gitignored, 100+ MB) — they are release assets.
# This workflow builds the app shell from source, downloads the packs from the newest
# release that carries them, and ships both as one Pages artifact.
#
# Trigger: manually, or on any version tag push (the tag's release must already have the
# pack assets attached — see HANDOFF.md "Release flow").
name: deploy-pages

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build web app (Pages base path)
        run: MLS_BASE_PATH=/multilingual-studies/ pnpm --filter @mls/web build

      - name: Download packs from the newest release with pack assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p apps/web/dist/packs
          # Newest PUBLISHED release whose three pack assets are ALL fully uploaded.
          # publishedAt, not createdAt: createdAt is the date of the TAG'S COMMIT, so a
          # pack release cut from an older commit sorts below an old release and stale
          # packs deploy silently. And all three assets must be state=uploaded: a release
          # lists manifest.json (750 B, finishes first) while the 74 MB media.pack is
          # still uploading, and gh release download exits 0 on a partial match.
          tag=$(gh release list --limit 20 --exclude-drafts --exclude-pre-releases \
            --json tagName,publishedAt \
            --jq 'sort_by(.publishedAt) | reverse | .[].tagName' | while read -r t; do
              names=$(gh release view "$t" --json assets \
                --jq '.assets[] | select(.state == "uploaded") | .name')
              ok=1
              for f in manifest.json content.pack media.pack; do
                echo "$names" | grep -qx "$f" || ok=0
              done
              if [ "$ok" = 1 ]; then echo "$t"; break; fi
            done)
          test -n "$tag" || { echo "no release with all three pack assets found"; exit 1; }
          echo "using packs from release $tag"
          gh release download "$tag" --dir apps/web/dist/packs \
            --pattern 'manifest.json' --pattern 'content.pack' --pattern 'media.pack'
          for f in manifest.json content.pack media.pack; do
            test -s "apps/web/dist/packs/$f" || { echo "missing pack asset: $f"; exit 1; }
          done
          ls -la apps/web/dist/packs

      - name: SPA fallback for client-side routes
        run: cp apps/web/dist/index.html apps/web/dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

      - id: deployment
        uses: actions/deploy-pages@v4
